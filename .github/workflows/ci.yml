# Pull requests and pushes run lint, typecheck, build, and the complete test suite.
# Manual minimal runs may skip build/tests; full adds the determinism check.
# Local equivalents:
#   minimal: npm run ci:minimal
#   standard: npm run ci
#   full: npm run ci:full
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: "CI level to run"
        required: false
        type: choice
        options:
          - minimal
          - standard
          - full
        default: "minimal"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Minimal gates: lint + typecheck (always runs)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run typecheck

  # Standard gates: mandatory for pull requests/pushes and manual standard/full runs.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.level == 'standard' || inputs.level == 'full'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexsona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexsona_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEXSONA_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/lexsona_test
      LEXSONA_TEST_POSTGRES_SCHEMA: lexsona_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Full gates: determinism check (only on workflow_dispatch with level == full)
  determinism-check:
    name: Determinism Check
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.level == 'full'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run format || true
      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || (echo "Error: Build or format produced uncommitted changes" && exit 1)

  # Summary job
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build-and-test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"; exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "❌ TypeCheck failed"; exit 1
          fi
          if [[ "${{ needs.build-and-test.result }}" != "success" && "${{ needs.build-and-test.result }}" != "skipped" ]]; then
            echo "❌ Build & Test failed"; exit 1
          fi
          echo "✅ CI Complete (level: ${{ inputs.level || 'minimal' }})"
